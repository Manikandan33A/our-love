<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story ❤️ - Manikandan & Varshini</title>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #ff6b81;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3436;
            --text-muted: #636e72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Colorful Floating Background Hearts */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            animation: flyHeart 6s linear infinite;
            bottom: -30px;
            opacity: 0.8;
        }

        @keyframes flyHeart {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-105vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* Main Container Card with Yellow Inner Glow */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 24px;
            width: 380px;
            max-width: 90vw;
            text-align: center;
            /* Outer card shadow + Inner Yellow Glow effect */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                        inset 0 0 20px rgba(255, 221, 89, 0.5),
                        inset 0 0 10px rgba(255, 193, 7, 0.4);
            border: 2px solid rgba(255, 235, 153, 0.9);
            z-index: 2;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, yellowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes yellowPulse {
            0% {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                            inset 0 0 15px rgba(255, 221, 89, 0.4),
                            inset 0 0 8px rgba(255, 193, 7, 0.3);
            }
            100% {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                            inset 0 0 30px rgba(255, 215, 0, 0.7),
                            inset 0 0 15px rgba(255, 183, 3, 0.5);
            }
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Top Progress Bar */
        .progress-bar-container {
            width: 100%;
            background: #dfe6e9;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(95deg, #ff4757, #ff6b81);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 3px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        h2 {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* Attractive Animated Glowing Border for Image Frame */
        .slideshow-wrapper {
            padding: 4px;
            border-radius: 20px;
            background: linear-gradient(45deg, #ff9a9e, #ff6b81, #ff4757, #fad0c4, #fecfef);
            background-size: 300% 300%;
            animation: borderAnimation 4s ease infinite;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3);
        }

        @keyframes borderAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .slideshow {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            aspect-ratio: 4 / 3;
        }

        .slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.4s ease;
        }

        .slideshow img.fade {
            animation: fadeInOut 0.4s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Memory Text Details */
        .memory {
            margin-top: 16px;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .memory h3 {
            color: #e84393;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .memory b {
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.4;
            font-weight: 650;
        }

        .page-indicator {
            font-size: 11px;
            color: #a4b0be;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Action Buttons Wrapper */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
            background: linear-gradient(135deg, #ff3344, #ff5268);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-prev {
            background: #f1f2f6;
            color: var(--text-muted);
            box-shadow: none;
            flex: 0.4;
        }

        .btn-prev:hover {
            background: #dfe4ea;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Colorful Floating Background Hearts -->

        },
        {

        },
        {

            indicator: "Moment 15 of 15"
        }

    let currentIndex = 0;

    function updateContent() {
        const imgElement = document.getElementById("memory-img");
        
        imgElement.classList.add("fade");
        
        setTimeout(() => {
            document.getElementById("main-title").innerText = pages[currentIndex].title;
            imgElement.src = pages[currentIndex].image;
            document.getElementById("date").innerText = pages[currentIndex].date;
            document.getElementById("text").innerText = pages[currentIndex].text;
            document.getElementById("action-btn").innerHTML = pages[currentIndex].btnText + ' <i class="fa-solid fa-heart"></i>';
            document.getElementById("page-num").innerText = pages[currentIndex].indicator;
            
            imgElement.classList.remove("fade");
        }, 200);

        let progressPercent = (currentIndex / (pages.length - 1)) * 100;
        document.getElementById("progress-bar").style.width = progressPercent + "%";

        const prevBtn = document.getElementById("prev-btn");
        if (currentIndex > 0) {
            prevBtn.style.display = "flex";
        } else {
            prevBtn.style.display = "none";
        }
    }

    function nextPage() {
        currentIndex++;
        if (currentIndex >= pages.length) {
            currentIndex = 0; 
        }
        updateContent();
    }

    function prevPage() {
        if (currentIndex > 0) {
            currentIndex--;
            updateContent();
        }
    }

    // Generate colorful floating hearts dynamically in background
    function createHeart() {
        const heartContainer = document.getElementById("heart-container");
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
        
        heart.style.left = Math.random() * 100 + "vw";
        
        const colors = ["#ff4757", "#ff6b81", "#ff9a9e", "#e84393", "#fd79a8", "#fab1a0", "#ff7675"];
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        
        heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
        heart.style.fontSize = (Math.random() * 14 + 12) + "px";
        
        heartContainer.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }

    setInterval(createHeart, 300);
</script>
