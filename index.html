<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d63031">
  <title>Our Love Story ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #2d3436;
    }
    .container {
      width: min(100%, 390px);
      padding: 24px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }
    h1 { margin: 0; font-size: clamp(1.35rem, 5vw, 1.65rem); color: #d63031; }
    h2 { margin: 10px 0 0; font-size: 1.1rem; color: #2d3436; }
    .slideshow { margin-top: 18px; }
    .slideshow img {
      display: block;
      width: 100%;
      height: clamp(220px, 65vw, 280px);
      object-fit: cover;
      border-radius: 10px;
      background: #f1f2f6;
    }
    .memory { margin-top: 18px; }
    .memory h3 { margin: 0 0 7px; color: #0984e3; font-size: 1rem; }
    .memory p { margin: 0; color: #636e72; font-size: .95rem; line-height: 1.5; }
    .page-indicator { margin-top: 10px; color: #8d969a; font-size: .8rem; font-weight: bold; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 20px;
      border: 2px solid #fdcb6e;
      border-radius: 8px;
      background: #ffeaa7;
      color: #6c5ce7;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: background-color .2s, transform .2s;
    }
    button:hover, button:focus-visible { background: #fdcb6e; }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #6c5ce7; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="main-title">❤️ Our Love Story ❤️</h1>
    <h2>Manikandan ❤️ Varshini</h2>
    <div class="slideshow">
      <img id="memory-img" src="Aji1.jpg" alt="Welcome memory" decoding="async">
    </div>
    <section class="memory" aria-live="polite">
      <h3 id="date">Welcome!</h3>
      <p id="text">Love you dii azhagii 💞</p>
      <div class="page-indicator" id="page-num">Welcome Page</div>
    </section>
    <button id="action-btn" type="button">Start Journey ❤️</button>
  </main>

  <script>
    const pages = [
      ["❤️ Our Love Story ❤️", "Aji1.jpg", "Welcome!", "Love you dii azhagii 💞", "Start Journey ❤️", "Welcome Page"],
      ["Lovable Moment 1", "Aji2.jpg", "1 May 2025", "Our first love chat. This day will always stay in my heart. ❤️", "Next Moment ❤️", "Moment 1 of 15"],
      ["Lovable Moment 2", "Aji3.jpg", "8 May 2025", "Our love journey started here... ✨", "Next Moment ❤️", "Moment 2 of 15"],
      ["Lovable Moment 3", "Aji4.jpg", "27 May 2025", "Our first video call 🌙", "Next Moment ❤️", "Moment 3 of 15"],
      ["Lovable Moment 4", "Aji5.jpg", "31 May 2025", "I called her 'dii' — thookam varuthu dii 💖🥰", "Next Moment ❤️", "Moment 4 of 15"],
      ["Lovable Moment 5", "Aji6.jpg", "6 June 2025", "She called me 'daa' — video call pannu daa 💖🥰", "Next Moment ❤️", "Moment 5 of 15"],
      ["Lovable Moment 6", "Aji7.jpg", "16 June 2025", "Our first audio call — boring AI conversation ✨", "Next Moment ❤️", "Moment 6 of 15"],
      ["Lovable Moment 7", "Aji8.jpg", "31 July 2025", "A small walk with her, dropping her at the bus ✨", "Next Moment ❤️", "Moment 7 of 15"],
      ["Lovable Moment 8", "Aji9.jpg", "14 August 2025", "Iruvarum kaiyuru katti konda naal 💖😊", "Next Moment ❤️", "Moment 8 of 15"],
      ["Lovable Moment 9", "Aji10.jpg", "2 September 2025", "Our first photo together — my dream with my sweet partner 💖😊", "Next Moment ❤️", "Moment 9 of 15"],
      ["Lovable Moment 10", "Aji11.jpg", "18 September 2025", "First time sitting with her ✨💖🫣", "Next Moment ❤️", "Moment 10 of 15"],
      ["Lovable Moment 11", "Aji12.jpg", "21 November 2025", "Marriage dream — woke up with beautiful thoughts ✨🥹💕", "Next Moment ❤️", "Moment 11 of 15"],
      ["Lovable Moment 12", "Aji13.jpg", "24 November 2025", "Our department dream succeeded 💖💕😘", "Next Moment ❤️", "Moment 12 of 15"],
      ["Lovable Moment 13", "Aji.jpg", "8 December 2025", "She gave me an unexpected birthday gift 🌹🥰", "Next Moment ❤️", "Moment 13 of 15"],
      ["Lovable Moment 14", "Aji15.jpg", "7 April 2026", "Enakku onnu venum... aanaa selavu vena. Vaangi thariyaa? Earring eduthuttu vaa — the first time she asked emotionally ✨♥️💝", "Next Moment ❤️", "Moment 14 of 15"],
      ["Lovable Moment 15", "Aji16.jpg", "Forever & Always", "Successfully completed our one-year anniversary 💍✨", "Restart Story 🔄", "Moment 15 of 15"]
    ];

    let currentIndex = 0;
    const [title, image, date, message, button, indicator] = ["main-title", "memory-img", "date", "text", "action-btn", "page-num"].map(id => document.getElementById(id));

    function renderPage() {
      const [pageTitle, imageSource, pageDate, pageText, buttonText, pageIndicator] = pages[currentIndex];
      title.textContent = pageTitle;
      image.src = imageSource;
      image.alt = `${pageTitle}: ${pageDate}`;
      date.textContent = pageDate;
      message.textContent = pageText;
      button.textContent = buttonText;
      indicator.textContent = pageIndicator;
    }

    button.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % pages.length;
      renderPage();
    });
  </script>
</body>
</html>
